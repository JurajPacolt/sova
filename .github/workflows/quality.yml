name: Quality

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sova
          POSTGRES_USER: sova
          POSTGRES_PASSWORD: sova_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sova -d sova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      DATABASE_DRIVER: pdo_pgsql
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: sova
      DATABASE_USER: sova
      DATABASE_PASSWORD: sova_ci_password
      DATABASE_SERVER_VERSION: "17"
      DATABASE_SSL_MODE: disable
      AUTH_COOKIE_SECURE: "false"
      AUTH_RATE_LIMIT_SECRET: sova-ci-rate-limit-secret
      RUN_DATABASE_TESTS: "true"
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, json, mbstring, pdo, pdo_pgsql, sodium, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply database migrations
        run: composer db:migrate

      - name: Run backend quality gate
        run: composer check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend quality gate
        run: npm run check

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run e2e
