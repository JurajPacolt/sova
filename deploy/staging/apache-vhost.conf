<VirtualHost *:80>
    ServerName sova-staging
    DocumentRoot /var/www/sova/frontend
    DirectoryIndex index.html

    Alias /api /var/www/sova/backend/public

    <Directory /var/www/sova/backend/public>
        AllowOverride None
        Options -Indexes
        Require all granted
        FallbackResource /api/index.php
    </Directory>

    <Directory /var/www/sova/frontend>
        AllowOverride None
        Options -Indexes
        Require all granted
        FallbackResource /index.html
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=()"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

