<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SOVA sémantické stavy a interakcie</title>
  <desc id="desc">Prístupné badge, priority, tlačidlá a formulárové stavy.</desc>
  <defs>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#0F172A" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#wash)"/>
  <rect x="64" y="54" width="1472" height="892" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>

  <text x="112" y="118" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="750">Sémantické stavy a interakcie</text>
  <text x="112" y="152" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="16">Farba + text + ikona. Nikdy iba farba.</text>
  <rect x="1278" y="102" width="210" height="40" rx="20" fill="#F1F5F9"/>
  <text x="1383" y="128" text-anchor="middle" fill="#334155" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="650">LIGHT MODE</text>

  <text x="112" y="224" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">Workflow</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="650">
    <g transform="translate(112 248)"><rect width="202" height="48" rx="24" fill="#E0F2FE"/><circle cx="26" cy="24" r="7" fill="#075985"/><text x="46" y="30" fill="#075985">Otvorená</text></g>
    <g transform="translate(330 248)"><rect width="220" height="48" rx="24" fill="#EEF2FF"/><path d="M22 17l10 7-10 7z" fill="#3730A3"/><text x="48" y="30" fill="#3730A3">Prebieha</text></g>
    <g transform="translate(566 248)"><rect width="220" height="48" rx="24" fill="#DCFCE7"/><path d="M20 24l5 5 10-12" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="30" fill="#166534">Vyriešená</text></g>
    <g transform="translate(802 248)"><rect width="206" height="48" rx="24" fill="#F1F5F9"/><path d="M19 19h14v12H19z" fill="none" stroke="#334155" stroke-width="2"/><text x="48" y="30" fill="#334155">Uzavretá</text></g>
  </g>

  <text x="112" y="360" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">Priority a spätná väzba</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="650">
    <g transform="translate(112 384)"><rect width="174" height="42" rx="10" fill="#F0FDFA"/><path d="M21 13v16M15 23l6 6 6-6" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/><text x="44" y="26" fill="#0F766E">Nízka</text></g>
    <g transform="translate(300 384)"><rect width="182" height="42" rx="10" fill="#F1F5F9"/><path d="M15 21h16" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="44" y="26" fill="#334155">Normálna</text></g>
    <g transform="translate(496 384)"><rect width="174" height="42" rx="10" fill="#FEF3C7"/><path d="M21 29V13M15 19l6-6 6 6" fill="none" stroke="#92400E" stroke-width="2" stroke-linecap="round"/><text x="44" y="26" fill="#92400E">Vysoká</text></g>
    <g transform="translate(684 384)"><rect width="184" height="42" rx="10" fill="#FEE2E2"/><path d="M21 12l11 19H10z" fill="none" stroke="#991B1B" stroke-width="2"/><path d="M21 18v6m0 3h.1" stroke="#991B1B" stroke-width="2" stroke-linecap="round"/><text x="44" y="26" fill="#991B1B">Kritická</text></g>
  </g>

  <line x1="112" y1="482" x2="1488" y2="482" stroke="#E2E8F0"/>

  <text x="112" y="538" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">Akcie</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="650">
    <g transform="translate(112 562)"><rect width="212" height="48" rx="10" fill="#4F46E5"/><text x="106" y="30" text-anchor="middle" fill="#FFFFFF">Vytvoriť úlohu</text></g>
    <g transform="translate(340 562)"><rect width="184" height="48" rx="10" fill="#FFFFFF" stroke="#64748B"/><text x="92" y="30" text-anchor="middle" fill="#0F172A">Uložiť koncept</text></g>
    <g transform="translate(540 562)"><rect width="118" height="48" rx="10" fill="#FFFFFF"/><text x="59" y="30" text-anchor="middle" fill="#4338CA">Zrušiť</text></g>
    <g transform="translate(674 562)"><rect width="168" height="48" rx="10" fill="#B91C1C"/><text x="84" y="30" text-anchor="middle" fill="#FFFFFF">Odstrániť</text></g>
  </g>

  <text x="944" y="538" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">Focus</text>
  <g transform="translate(944 562)">
    <rect x="-5" y="-5" width="310" height="58" rx="15" fill="none" stroke="#6366F1" stroke-width="3"/>
    <rect width="300" height="48" rx="10" fill="#FFFFFF" stroke="#64748B"/>
    <text x="16" y="30" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="15">Hľadať úlohy…</text>
    <path d="M271 18a9 9 0 1 0 0 .1m7 7 7 7" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>

  <line x1="112" y1="674" x2="1488" y2="674" stroke="#E2E8F0"/>
  <text x="112" y="730" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">Kontrastové pravidlá</text>
  <g font-family="Inter, Segoe UI, sans-serif">
    <g transform="translate(112 754)">
      <rect width="408" height="118" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
      <circle cx="38" cy="38" r="18" fill="#DCFCE7"/><path d="M29 38l6 6 13-15" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="37" fill="#0F172A" font-size="16" font-weight="700">Text najmenej 4.5:1</text>
      <text x="70" y="63" fill="#475569" font-size="14">Primárny button dosahuje 6.29:1.</text>
      <text x="70" y="87" fill="#475569" font-size="14">Hlavný text na surface 17.85:1.</text>
    </g>
    <g transform="translate(536 754)">
      <rect width="408" height="118" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
      <circle cx="38" cy="38" r="18" fill="#EEF2FF"/><path d="M28 38h20m-10-10v20" stroke="#3730A3" stroke-width="3" stroke-linecap="round"/>
      <text x="70" y="37" fill="#0F172A" font-size="16" font-weight="700">Netextové prvky 3:1</text>
      <text x="70" y="63" fill="#475569" font-size="14">Focus, input border a aktívny stav</text>
      <text x="70" y="87" fill="#475569" font-size="14">musia zostať rozpoznateľné.</text>
    </g>
    <g transform="translate(960 754)">
      <rect width="528" height="118" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
      <circle cx="38" cy="38" r="18" fill="#E0F2FE"/><path d="M31 32h14v12H31zM35 28v4m6-4v4" fill="none" stroke="#075985" stroke-width="2" stroke-linecap="round"/>
      <text x="70" y="37" fill="#0F172A" font-size="16" font-weight="700">Význam nie je iba vo farbe</text>
      <text x="70" y="63" fill="#475569" font-size="14">Použi názov, ikonu alebo tvar.</text>
      <text x="70" y="87" fill="#475569" font-size="14">Stav ostáva čitateľný aj bez farieb.</text>
    </g>
  </g>

  <text x="112" y="918" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="13">SOVA Design System · WCAG 2.2 AA · 2026</text>
  <text x="1488" y="918" text-anchor="end" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="13">4 px raster · 44 px cieľ · 3 px focus ring</text>
</svg>
