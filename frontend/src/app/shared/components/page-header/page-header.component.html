<header class="page-header d-flex flex-wrap align-items-start justify-content-between gap-3">
  <div>
    @if (eyebrow(); as eyebrowText) {
      <p class="page-header__eyebrow mb-1">{{ eyebrowText }}</p>
    }

    <h1 class="h2 mb-1">{{ title() }}</h1>

    @if (subtitle(); as subtitleText) {
      <p class="text-body-secondary mb-0">{{ subtitleText }}</p>
    }
  </div>

  <div class="page-header__actions">
    <ng-content select="[actions]" />
  </div>
</header>
