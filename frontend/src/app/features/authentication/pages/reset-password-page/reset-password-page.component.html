<app-public-auth-layout title="access.resetTitle" subtitle="access.resetSubtitle">
  @if (completed()) {
    <div class="alert alert-success mb-4" role="status" aria-live="polite">
      {{ 'access.resetCompleted' | translate }}
    </div>
    <a class="btn btn-primary w-100" routerLink="/login">
      {{ 'access.signIn' | translate }}
    </a>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      @if (error(); as errorMessage) {
        <div class="alert alert-danger" role="alert" aria-live="polite">
          {{ errorMessage | translate }}
        </div>
      }

      <div class="mb-3">
        <label class="form-label" for="new-password">
          {{ 'access.newPassword' | translate }}
        </label>
        <input
          id="new-password"
          class="form-control"
          type="password"
          autocomplete="new-password"
          formControlName="password"
          [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
        <div class="form-text">{{ 'access.passwordHint' | translate }}</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password-confirmation">
          {{ 'access.confirmPassword' | translate }}
        </label>
        <input
          id="password-confirmation"
          class="form-control"
          type="password"
          autocomplete="new-password"
          formControlName="password_confirmation"
        />
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="submitting() || token === ''">
        @if (submitting()) {
          {{ 'access.saving' | translate }}
        } @else {
          {{ 'access.setNewPassword' | translate }}
        }
      </button>
      <a class="btn btn-link w-100 mt-2" routerLink="/forgot-password">
        {{ 'access.requestNewLink' | translate }}
      </a>
    </form>
  }
</app-public-auth-layout>
